name: Daily Tips

on:
  schedule:
    - cron: "0 6 * * *"   # joka päivä klo 06:00 Suomen aikaa (UTC+3 → 03:00 UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate tips with Ollama
        shell: powershell
        run: |
          Write-Host "Calling Ollama..."
          $response = ollama run llama3.1 `
            "Anna kolme lyhyttä vinkkiä pienoismallien rakentamiseen. Palauta vastaus JSON-muodossa:
            {
              \"tips\": [
                {\"title\": \"\", \"text\": \"\"},
                {\"title\": \"\", \"text\": \"\"},
                {\"title\": \"\", \"text\": \"\"}
              ]
            }"
          Write-Host "Ollama JSON:"
          Write-Host $response

          # Tallenna JSON tiedostoon
          Set-Content -Path tips.json -Value $response -Encoding UTF8

      - name: Generate HTML with Python
        shell: powershell
        run: |
          Write-Host "Generating HTML..."
          python - << 'EOF'
import json

with open("tips.json", "r", encoding="utf-8") as f:
    data = json.load(f)

html = "<html><body><h1>Pienoismallivinkit</h1>"
for tip in data["tips"]:
    html += f"<h2>{tip['title']}</h2><p>{tip['text']}</p>"
html += "</body></html>"

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html)
EOF

      - name: Commit HTML
        shell: powershell
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git add index.html tips.json
          git commit -m "Daily tips update"
          git push
