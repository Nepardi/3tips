name: Daily Tips

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate tips with Ollama
        shell: powershell
        run: |
          $prompt = @"
Anna kolme lyhyttä vinkkiä pienoismallien rakentamiseen.
Palauta vastaus JSON-muodossa:
{
  "tips": [
    {"title": "", "text": ""},
    {"title": "", "text": ""},
    {"title": "", "text": ""}
  ]
}
"@
          $response = ollama run llama3.1 $prompt
          Set-Content -Path tips.json -Value $response -Encoding UTF8

      - name: Generate HTML with Python
        shell: powershell
        run: |
          python - << 'EOF'
import json

with open("tips.json", "r", encoding="utf-8") as f:
    data = json.load(f)

html = "<html><body><h1>Pienoismallivinkit</h1>"
for tip in data["tips"]:
    html += f"<h2>{tip['title']}</h2><p>{tip['text']}</p>"
html += "</body></html>"

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html)
EOF

      - name: Commit HTML
        shell: powershell
        run: |
          git config --global user.email "actions@github.com"
