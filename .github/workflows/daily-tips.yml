name: Daily Tips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Run Ollama API
        run: |
          curl -s http://localhost:11434/api/generate -H "Content-Type: application/json" -d "{\"model\":\"llama3.1\",\"prompt\":\"TECHNICAL TOPIC: MINIATURE MODEL BUILDING. Give exactly 3 practical tips in English. OUTPUT VALID JSON ONLY, single line, no extra text: {tips:[{title,text},{title,text},{title,text}]}\",\"stream\":false,\"format\":\"json\"}" > tips.json
        shell: cmd

      - name: Generate HTML
        run: python generate_html.py
        shell: cmd

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html
          git diff --quiet --cached || git commit -m "Daily tips update"
          git push
        shell: cmd
