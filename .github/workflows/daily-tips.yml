name: Update Daily Tips

on:
  schedule:
    - cron: "0 0 * * *"   # Ajetaan joka yö klo 00:00
  workflow_dispatch:       # Mahdollistaa manuaalisen ajon

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tips with Copilot
        id: ai
        uses: actions/ai@v1
        with:
          model: copilot
          prompt: |
            Anna 3 lyhyttä vinkkiä aiheesta "pienoismallien valmistus" suomeksi.
            Anna myös 3 lyhyttä vinkkiä englanniksi.
            Palauta JSON-muodossa:
            {
              "finnish": ["vinkki1", "vinkki2", "vinkki3"],
              "english": ["tip1", "tip2", "tip3"]
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tip generator
        env:
          AI_OUTPUT: ${{ steps.ai.outputs.result }}
        run: |
          python scripts/generate_tips.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Daily tips update" || echo "No changes to commit"
          git push --force
