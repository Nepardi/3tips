name: Daily Tips (Ollama)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tips with Ollama
        id: ai
        shell: pwsh
        run: |
          Write-Host "Calling Ollama..."

          $prompt = @"
Vastaa täsmälleen tässä muodossa:
{
  \"finnish\": [
    \"vinkki 1\",
    \"vinkki 2\",
    \"vinkki 3\"
  ],
  \"english\": [
    \"tip 1\",
    \"tip 2\",
    \"tip 3\"
  ]
}
Anna 3 lyhyttä vinkkiä pienoismallien valmistuksesta suomeksi ja 3 englanniksi.
Palauta vain JSON, ei selityksiä.
"@

          $RESPONSE = ollama run llama3.1 $prompt

          Write-Host "Ollama raw response:"
          Write-Host $RESPONSE

          "result=$RESPONSE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tip generator
        env:
          AI_OUTPUT: ${{ steps.ai.outputs.result }}
        run: python scripts/generate_tips.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Daily tips update" || echo "No changes to commit"
          git push
