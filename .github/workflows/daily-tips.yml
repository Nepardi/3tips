name: Daily Tips

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v5

      - name: Wait for Ollama
        run: |
          ping -n 5 127.0.0.1 >nul
        shell: cmd

      - name: Generate Tips
        run: python generate_html.py
        shell: cmd

      - name: Show Response
        run: |
          type tips.json
        shell: cmd

      - name: Install Bluesky dependencies
        run: pip install atproto
        shell: cmd

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python bluesky_post.py
        shell: cmd

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html topics.json archive/
          git diff --quiet --cached || git commit -m "Tips update + domain scalemodeltips.eu"
          git push
        shell: cmd
