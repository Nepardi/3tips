name: Daily Tips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate tips with Ollama
        run: |
          ollama run llama3.1 --format json "Anna kolme vinkkia pienoismalleihin. Palauta vain JSON-muotoisia tietoja." > tips.json
        shell: bash

      - name: Create Python script
        run: |
          cat > generate.py << 'PYEOF'
import json
import re

with open("tips.json", "r", encoding="utf-8") as f:
    content = f.read()

match = re.search(r"{.*}", content, re.DOTALL)
if not match:
    print("Ei JSON-tietoa")
    exit(1)

data = json.loads(match.group())

html = "<html><body><h1>Vinkit</h1>"
for t in data["tips"]:
    html += f"<h2>{t['title']}</h2><p>{t['text']}</p>"
html += "</body></html>"

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html)
PYEOF
        shell: bash

      - name: Run Python
        run: python generate.py
        shell: bash

      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html tips.json
          git diff --cached --quiet || (git commit -m "Daily tips upda
