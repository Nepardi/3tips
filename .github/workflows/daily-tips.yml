name: Daily Tips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate JSON
        run: echo '{"tips":[{"title":"Vinkki 1","text":"Sisalto 1"},{"title":"Vinkki 2","text":"Sisalto 2"},{"title":"Vinkki 3","text":"Sisalto 3"}]}' > tips.json
      
      - name: Generate HTML
        run: python3 generate_html.py
      
      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html
          git commit -m "Update tips" || true
          git push
