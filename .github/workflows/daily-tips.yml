name: Daily Tips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate tips with Ollama
        run: |
          $prompt = 'Anna kolme vinkkia pienoismalleihin. Palauta vain JSON.'
          ollama run llama3.1 "$prompt --format json" 2>&1 | Select-String -Pattern '\{.*\}' > tips.json
        shell: pwsh

      - name: Create Python script
        run: |
          $script = 'import json,re,sys
content=open("tips.json").read()
m=re.search(r"{.*}",content,re.DOTALL)
if not m:print("No JSON");sys.exit(1)
d=json.loads(m.group())
h="<html><body><h1>Vinkit</h1>"
for t in d["tips"]:h+=f"<h2>{t[\'title\']}</h2><p>{t[\'text\']}</p>"
h+="</body></html>"
open("index.html","w",encoding="utf-8").write(h)'
          [System.IO.File]::WriteAllText("generate.py",$script)
        shell: pwsh

      - name: Run Python
        run: python generate.py
        shell: pwsh

      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html tips.json
          git diff --cached --quiet || (git commit -m "Daily tips update" && git push)
        shell: pwsh
