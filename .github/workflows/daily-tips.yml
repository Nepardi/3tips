name: Update Daily Tips (Safe)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install jq -y

      - name: Call OpenAI safely
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Calling OpenAI..."

          RESPONSE=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/chat/completions \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [
                {
                  "role": "user",
                  "content": "Anna 3 lyhyttä vinkkiä aiheesta pienoismallien valmistus suomeksi ja 3 englanniksi. Palauta JSON-muodossa: {\"finnish\": [...], \"english\": [...]}"
                }
              ]
            }')

          echo "OpenAI raw response:"
          echo "$RESPONSE"

          # Poimitaan vain content, ei koko JSONia
          SAFE_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' 2>/dev/null || echo "")

          # Jos SAFE_CONTENT on tyhjä, ei kirjoiteta rikkinäistä outputia
          if [ -z "$SAFE_CONTENT" ]; then
            echo "result=" >> $GITHUB_OUTPUT
          else
            echo "result=$SAFE_CONTENT" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tip generator safely
        env:
          AI_OUTPUT: ${{ steps.ai.outputs.result }}
        run: |
          python scripts/generate_tips.py || echo "Python failed safely"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Daily tips update" || echo "No changes to commit"
          git push --force
