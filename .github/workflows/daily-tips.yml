name: Daily Tips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Run Ollama
        run: ollama run llama3.1 --format json "Anna kolme vinkkia pienoismalleihin. Palauta vain JSON" > tips.json
        shell: bash

      - name: Generate HTML
        run: python3 generate_html.py
        shell: bash

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html
          git diff --quiet --cached || git commit -m "Daily tips update"
          git push
        shell: bash
