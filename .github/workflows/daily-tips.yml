name: Daily Tips

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (0, 6, 12, 18 UTC)
  workflow_dispatch:       # Allow manual runs for testing

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v5

      - name: Run Ollama CLI
        run: |
          call ollama run llama3.1 --format json "TECHNICAL TOPIC: SCALE MODEL BUILDING. Give exactly 5 practical tips in English. OUTPUT VALID JSON ONLY, no extra text: {tips:[{title,text},{title,text},{title,text},{title,text},{title,text}]}" > tips.json
        shell: cmd

      - name: Show Response
        run: |
          type tips.json
        shell: cmd

      - name: Generate HTML
        run: python generate_html.py
        shell: cmd

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html
          git diff --quiet --cached || git commit -m "Daily tips update $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
          git push
        shell: cmd
