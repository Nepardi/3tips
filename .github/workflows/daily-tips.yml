name: Daily Tips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate JSON
        run: echo '{"tips":[{"title":"Vinkki 1","text":"Sisältö 1"},{"title":"Vinkki 2","text":"Sisältö 2"},{"title":"Vinkki 3","text":"Sisältö 3"}]}' > tips.json
      
      - name: Generate HTML
        run: |
          python3 << 'SCRIPT'
import json
with open('tips.json') as f:
    data = json.load(f)
html = '<html><body><h1>Vinkit</h1>'
for t in data['tips']:
    html += f"<h2>{t['title']}</h2><p>{t['text']}</p>"
html += '</body></html>'
with open('index.html', 'w') as f:
    f.write(html)
SCRIPT

      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html
          git commit -m "Update tips" || true
          git push
