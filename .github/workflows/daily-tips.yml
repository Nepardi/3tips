name: Daily Tips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate tips with Ollama
        run: |
          $prompt = 'Anna kolme vinkkia pienoismalleihin. Palauta vain JSON: {"tips":[{"title":"","text":""},{"title":"","text":""},{"title":"","text":""}]}'
          ollama run llama3.1 "$prompt --format json" 2>&1 | Select-String -Pattern '\{.*\}' | ForEach-Object { $_.Line } > tips.json
        shell: pwsh

      - name: Create Python script
        run: |
          Set-Content -Path generate.py -Value @'
import json, re, sys
content = open("tips.json").read()
match = re.search(r"\{.*\}", content, re.DOTALL)
if not match:
    print("No JSON found")
    sys.exit(1)
data = json.loads(match.group())
html = "<html><body><h1>Vinkit</h1>"
for t in data["tips"]:
    html += f"<h2>{t['title']}</h2><p>{t['text']}</p>"
html += "</body></html>"
open("index.html","w",encoding="utf-8").write(html)
'@ -NoNewline
        shell: pwsh

      - name: Run Python
        run: python generate.py
        shell: pwsh

      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html tips.json
          git diff --cached --quiet || (git commit -m "Daily tips update" && git push)
        shell: pwsh
