name: Update Daily Tips

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tips with Copilot AI
        id: ai
        run: |
          echo "Calling Copilot AI..."
          RESPONSE=$(curl -s \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.githubcopilot.com/v1/chat/completions \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [
                {
                  "role": "user",
                  "content": "Anna 3 lyhyttä vinkkiä aiheesta pienoismallien valmistus suomeksi ja 3 englanniksi. Palauta JSON-muodossa: {\"finnish\": [...], \"english\": [...]}"
                }
              ]
            }')

          echo "$RESPONSE" > ai.json
          echo "result=$(cat ai.json)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tip generator
        env:
          AI_OUTPUT: ${{ steps.ai.outputs.result }}
        run: |
          python scripts/generate_tips.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Daily tips update" || echo "No changes to commit"
          git push --force
