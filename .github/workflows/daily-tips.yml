name: Daily Tips

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v5

      - name: Wait for Ollama
        shell: powershell
        run: |
          $timeout = 120
          $start = Get-Date
          while ((Get-Date) -lt $start.AddSeconds($timeout)) {
            try {
              Invoke-RestMethod -Uri http://localhost:11434/api/tags -TimeoutSec 5 | Out-Null
              Write-Host 'Ollama is ready!'
              exit 0
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          Write-Host 'Ollama not ready after 120 seconds'
          exit 1

      - name: Generate Tips
        run: python generate_html.py
        shell: cmd

      - name: Show Response
        run: |
          type tips.json
        shell: cmd

      - name: Install Bluesky dependencies
        run: pip install atproto
        shell: cmd

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python bluesky_post.py
        shell: cmd

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html topics.json archive/ rss.xml
          git diff --quiet --cached || git commit -m "Tips update + domain scalemodeltips.eu"
          git push
        shell: cmd
