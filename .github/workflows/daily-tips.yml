name: Daily Tips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Run Ollama CLI
        run: |
          call ollama run llama3.1 --format json "TECHNICAL TOPIC: MINIATURE MODEL BUILDING. Give exactly 3 practical tips in English. OUTPUT VALID JSON ONLY, no extra text, single line: {tips:[{title,text},{title,text},{title,text}]}" > tips.json
        shell: cmd

      - name: Show Response
        run: |
          type tips.json
        shell: cmd

      - name: Generate HTML
        run: python generate_html.py
        shell: cmd

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html
          git diff --quiet --cached || git commit -m "Daily tips update"
          git push
        shell: cmd
