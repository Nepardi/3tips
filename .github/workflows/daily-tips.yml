name: Daily Tips

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v5

      - name: Generate Tips
        run: python generate_html.py
        shell: cmd

      - name: Show Response
        run: |
          type tips.json
        shell: cmd

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tips.json index.html topics.json
          git diff --quiet --cached || git commit -m "Tips update - $(type tips.json | findstr /n . | findstr ^[1]:)"
          git push
        shell: cmd
