
name: Daily Tips (Ollama)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call Ollama
        shell: powershell
        run: |
          Write-Host "Calling Ollama..."

          $prompt = @"
Anna 3 lyhyttä vinkkiä pienoismallien valmistuksesta suomeksi ja 3 englanniksi.
Palauta vain JSON:
{
  "finnish": ["v1","v2","v3"],
  "english": ["t1","t2","t3"]
}
"@

          $response = ollama run llama3.1 $prompt

          Write-Host "Ollama response:"
          Write-Host $response

          "result=$response" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate HTML
        env:
          AI_OUTPUT: ${{ steps.generate.outputs.result }}
        run: python scripts/generate_tips.py

      - name: Commit and push
        shell: powershell
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Daily tips update" || Write-Host "No changes"
          git push
